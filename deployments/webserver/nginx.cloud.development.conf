# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/invoice/webserver.pid;
error_log /var/log/sdkwork/invoice/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name invoice-dev.sdkwork.com invoice-dev.birdcoder.com invoice-dev.dtupay.com invoice-dev.sdkwork.cn invoice-dev.birdcoder.cn invoice-dev.dtupay.cn invoice-dev.skubc.com invoice-dev.skubc.cn invoice-dev.zowalk.com invoice-dev.zowalk.cn invoice-dev.offer86.com invoice-dev.offer86.cn invoice-dev.86offer.com invoice-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
