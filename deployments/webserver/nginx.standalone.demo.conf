# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/invoice/webserver.pid;
error_log /var/log/sdkwork/invoice/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name invoice-demo.sdkwork.com invoice-demo.birdcoder.com invoice-demo.dtupay.com invoice-demo.noaper.com invoice-demo.sdkwork.cn invoice-demo.birdcoder.cn invoice-demo.dtupay.cn invoice-demo.noaper.cn invoice-demo.skubc.com invoice-demo.skubc.cn invoice-demo.zowalk.com invoice-demo.zowalk.cn invoice-demo.offer86.com invoice-demo.offer86.cn invoice-demo.86offer.com invoice-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/invoice/web/static;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
